name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - run: haxelib install hxnodejs 12.2.0 --quiet
      # Reference build with the Haxe interpreter.
      - run: make build
      # The committed Node build must be Haxe-trace-free and reproduce dist/ exactly.
      - run: make js-check
      # The sources must still compile for the JS target on current Haxe
      # (output goes to a temp path; the committed gen/site.js is generated locally).
      - run: haxe build-node.hxml -js "$RUNNER_TEMP/site.js"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
